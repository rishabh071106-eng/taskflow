# Checks brodoit.com every 30 minutes and after each deploy. A failed scheduled run emails the repo owner
# (GitHub's default), so an outage is noticed within half an hour. Public pages only: no keys, no logins.
# v40: when brodoit.com is behind main (Railway's GitHub link deployed an older commit late: on 9 Nov 2026 it built
# a commit 1.5 hours after its push and put it over the newer build), this asks deploy.yml to upload main's head
# from CI right away (its "force" input), so the site heals itself within half an hour.
name: Live check
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  deployments: read
  actions: write
jobs:
  live:
    # the mirror repo (brodoit) is not what Railway deploys, so only its scheduled and manual runs check the site
    if: github.event_name != 'push' || github.repository == 'rishabh071106-eng/taskflow'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: brodoit.com answers on every app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # after a push, wait until brodoit.com runs this very commit (Railway reports it in /api/health), so the
          # checks below test the new deploy, not the old one still serving while the new one builds
          want=""; [ "$GITHUB_EVENT_NAME" = push ] && want="${GITHUB_SHA:0:12}"
          # Railway marks each commit it builds as a GitHub deployment. When none has started after 3 minutes the
          # deploy was not triggered (held on Railway's side): say so and check the build that is live, without
          # failing, so a Railway that waits for CI to pass is never blocked by this check waiting for Railway.
          if [ -n "$want" ]; then
            started=0
            for i in $(seq 1 12); do # 6 minutes: Railway's own deploy, or the CI deploy (deploy.yml) after its 2-minute wait
              n=$(curl -fsS --max-time 20 -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/deployments?sha=$GITHUB_SHA" | jq 'length' 2>/dev/null || echo 0)
              [ "${n:-0}" -gt 0 ] 2>/dev/null && { started=1; break; }
              sleep 30
            done
            if [ "$started" = 0 ]; then echo "::warning::Neither Railway nor CI started a deploy for $want (no GitHub deployment after 6 minutes); checking the build that is live"; want=""; fi
          fi
          ok=0; live=""
          for i in $(seq 1 40); do # a deploy that is still building or rolling out gets up to 20 minutes
            h=$(curl -fsS --max-time 20 https://brodoit.com/api/health || echo '{}')
            if echo "$h" | grep -q '"status":"ok"'; then
              ok=1; live=$(echo "$h" | sed -n 's/.*"commit":"\([0-9a-f]*\)".*/\1/p')
              if [ -z "$want" ] || [ "$live" = "$want" ]; then break; fi
              echo "brodoit.com still runs ${live:-an older build}; waiting for $want ($i)"
            else ok=0; echo "health not ready ($i)"; fi
            sleep 30
          done
          [ "$ok" = 1 ] || { echo "::error::brodoit.com/api/health is down"; exit 1; }
          # v40: heal = ask deploy.yml (force) to upload main's head from CI now; only the deploy repo has Railway
          heal() {
            [ "$GITHUB_REPOSITORY" = rishabh071106-eng/taskflow ] || return 0
            if curl -fsS --max-time 20 -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/dispatches" -d '{"ref":"main","inputs":{"force":"true"}}' > /dev/null
            then echo "::notice::asked deploy.yml to upload main's head to Railway now ($1)"
            else echo "::warning::could not start the healing deploy ($1)"; fi
          }
          # v24: how far brodoit.com is behind main (a deploy that silently stopped shows up the same day)
          if [ -n "$live" ]; then
            behind=$(curl -fsS --max-time 20 -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/compare/$live...main" | jq -r '.ahead_by // empty' 2>/dev/null || true)
            if [ -n "$behind" ] && [ "$behind" != 0 ]; then echo "::warning::brodoit.com runs $live, $behind commit(s) behind main"; heal "brodoit.com is $behind commit(s) behind main"; else echo "brodoit.com runs $live (main)"; fi
          else echo "::warning::brodoit.com reports no commit in /api/health"; fi
          if [ -n "$want" ] && [ "$live" != "$want" ]; then
            if [ -z "$live" ]; then echo "::warning::/api/health reports no commit; testing whatever is live"
            else echo "::error::brodoit.com still runs $live, not $want, after 20 minutes (deploy stuck?)"; exit 1; fi
          fi
          fail=0
          for p in / /app/ui.css /app/voice.js /mind/ '/mind/game.html?g=memory' /code/ '/lang/course.html?c=es' /sw.js; do
            if curl -fsS --max-time 20 -o /dev/null -w "%{http_code} $p\n" "https://brodoit.com$p"; then :; else echo "::error::$p failed"; fail=1; fi
          done
          [ "$fail" = 0 ] || exit 1
      - name: Bro is ready (brain answers, voice speaks, hearing hears)
        run: |
          # /api/bro/ok is one bit: Bro Core's brain is configured and his voice engine is loaded.
          # After a deploy the voice model may still be loading, so this waits up to 15 minutes.
          for i in $(seq 1 30); do
            st=$(curl -fsS --max-time 20 https://brodoit.com/api/bro/ok || echo '{}')
            # ready = brain configured + voice loaded + the self-test passed (a real brain answer, Bro's voice heard back, and a
            # live-style turn with the real tool definitions answered "When does Navratri end this year?", and a real call
            # turn through the phone's own path answered "What is the capital of India?" out loud)
            if echo "$st" | grep -q '"ok":true' && echo "$st" | grep -q '"check":{"brain":"ok","hearing":"ok","tools":"ok","talk":"ok"}'; then echo "Bro is ready $st"; exit 0; fi
            if echo "$st" | jq -e '(.check // {}) | to_entries | any(.value == "fail")' > /dev/null 2>&1; then echo "::error::Bro's self-test failed: $st"; exit 1; fi
            echo "Bro not ready yet ($i): $st"; sleep 30
          done
          echo "::error::Bro Core is not ready (brain or voice down)"; exit 1
      - name: Bro's own brain (his own model on our server; reported here, never blocks a release)
        run: |
          # after a deploy the model may still be downloading (once) and loading: wait up to 20 minutes for its own self-check
          own='{}'; chk=none
          for i in $(seq 1 40); do
            st=$(curl -fsS --max-time 20 https://brodoit.com/api/bro/ok || echo '{}')
            own=$(echo "$st" | jq -c '.own // {}' 2>/dev/null || echo '{}')
            state=$(echo "$own" | jq -r '.state // "none"'); chk=$(echo "$own" | jq -r '.check // "none"')
            case "$state" in idle|downloading|loading) echo "own brain $state ($i): $own"; sleep 30; continue;; esac
            if [ "$state" = ready ] && [ "$chk" != ok ] && [ "$chk" != fail ]; then echo "own brain ready, self-check running ($i): $own"; sleep 30; continue; fi
            break
          done
          if [ "$chk" = ok ]; then echo "::notice::Bro's own brain answers by itself: $own"; else echo "::warning::Bro's own brain is not answering by itself yet (the cloud brain answers): $own"; fi
      - name: Bro's cloud brains (which clouds answer, and how fast; reported here, never blocks a release)
        run: |
          st=$(curl -fsS --max-time 20 https://brodoit.com/api/bro/ok || echo '{}')
          clouds=$(echo "$st" | jq -c '.clouds // {}' 2>/dev/null || echo '{}')
          speed=$(echo "$st" | jq -c '.live // {} | {cloud, own, ownBackup, cloudSlow, firstMs, chatFirstMs}' 2>/dev/null || echo '{}')
          if [ "$(echo "$clouds" | jq -r '.gemini // false')" != false ]; then echo "::notice::Bro's cloud brains: $clouds · calls and chat: $speed"; else echo "::warning::Only Groq answers (no Gemini key, or it was refused): $clouds · $speed"; fi
      - name: Bro's one voice (lesson clips and the library recorded in it; reported here, never blocks a release)
        run: |
          st=$(curl -fsS --max-time 20 https://brodoit.com/api/learn/voice-status || echo '{}')
          sum=$(echo "$st" | jq -c '{voice, recorded, total, crawler: (.crawler // {} | {state, made}), library: (.library // {} | {voice, recorded, total, state})}' 2>/dev/null || echo '{}')
          if echo "$st" | jq -e '.voice | startswith("bro-")' > /dev/null 2>&1; then echo "::notice::Bro's voice in lessons: $sum"; else echo "::warning::Lesson clips are not in Bro's voice folder yet: $sum"; fi
      - name: Phone notifications and shared stories (reported here, never blocks a release)
        run: |
          st=$(curl -fsS --max-time 20 https://brodoit.com/api/notify/status || echo '{}')
          key=$(curl -fsS --max-time 20 https://brodoit.com/api/push/vapid-key | jq -r '.key // ""' 2>/dev/null || echo '')
          # the push key must be the server's own (the one once published in the repo starts BPfvXAUnm)
          case "$key" in BPfvXAUnm*) echo "::warning::Push still uses the key that was published in the repo";; "") echo "::warning::No push key";; *) echo "::notice::Phone notifications: $(echo "$st" | jq -c .)";; esac
          id=$(curl -fsS --max-time 20 'https://brodoit.com/api/news/desk?limit=1' | jq -r '.stories[0].id // ""' 2>/dev/null || echo '')
          if [ -n "$id" ]; then
            code=$(curl -s -o /tmp/n.html -w '%{http_code}' --max-time 20 "https://brodoit.com/n/$id")
            if [ "$code" = 200 ] && grep -q 'og:title' /tmp/n.html; then echo "::notice::Shared stories open at https://brodoit.com/n/$id with a link preview"; else echo "::warning::/n/$id answered $code"; fi
          else echo "::warning::No story to try /n/ with"; fi
      - name: This release on the site (v23 Bro's plan card, v24 one app language; reported here, never blocks a release)
        run: |
          # v24: the page has the one language switch (setAppLang) and the Mind games read it; the service worker is v187
          page=$(curl -fsS --max-time 30 https://brodoit.com/ || true)
          sw=$(curl -fsS --max-time 20 https://brodoit.com/sw.js | grep -o 'CACHE_VER="[^"]*"' || true)
          mind=$(curl -fsS --max-time 20 https://brodoit.com/mind/assets/util.js | grep -c 'bd_lang' || true)
          if echo "$page" | grep -q 'window.setAppLang=' && [ "${mind:-0}" -gt 0 ]; then echo "::notice::v24 is live: one app language (setAppLang, Mind games in Hindi) · service worker $sw"
          else echo "::warning::v24 is not live yet: setAppLang $(echo "$page" | grep -c 'window.setAppLang=') · Mind bd_lang $mind · service worker $sw"; fi
          # v23: Bro writes plans down (the plan card, V.showDoc, in the page's Bro chat)
          doc=$(curl -fsS --max-time 20 https://brodoit.com/app/voice.js | grep -c 'V.showDoc' || true)
          if [ "${doc:-0}" -gt 0 ]; then echo "::notice::v23 is live: Bro writes plans down (the plan card)"; else echo "::warning::v23 is not live yet: no plan card in app/voice.js"; fi
      - name: News quality (which writer wrote each story, Hindi in English fields, cut summaries, repeats; reported here, never blocks a release)
        run: |
          st=$(curl -fsS --max-time 30 'https://brodoit.com/api/news/desk?limit=60' || echo '{}')
          n=$(echo "$st" | jq '.stories | length' 2>/dev/null || echo 0)
          echo "stories: $n · writer of the desk: $(echo "$st" | jq -r '.writer // "?"') · last batch: $(echo "$st" | jq -r '.updated_at // "?"')"
          echo "by writer: $(echo "$st" | jq -c '[.stories[].writer] | group_by(.) | map({(.[0] // "none"): length}) | add' 2>/dev/null)"
          hin=$(echo "$st" | jq '[.stories[] | select(((.headline // "") + (.summary // "")) | test("[\u0900-\u097F]"))] | length' 2>/dev/null || echo '?')
          cut=$(echo "$st" | jq '[.stories[] | select((.summary // "") | test("(…|\\.\\.\\.)\\s*$"))] | length' 2>/dev/null || echo '?')
          echo "Hindi script in the English headline or story: $hin · stories cut off with …: $cut"
          # v22: three editions a day (07:00, 13:00, 19:00 India time); every story carries the edition that wrote it
          echo "edition: $(curl -fsS --max-time 20 https://brodoit.com/api/news/edition 2>/dev/null | jq -c '{id, label, count, next_at}' 2>/dev/null || echo 'none (before v22)')"
          echo "by edition: $(echo "$st" | jq -c '[.stories[].edition] | group_by(.) | map({(.[0] // "before v22"): length}) | add' 2>/dev/null)"
          echo "Hindi versions: $(echo "$st" | jq '[.stories[] | select((.headline_hi // "") != "")] | length' 2>/dev/null) of $n · with why it matters: $(echo "$st" | jq '[.stories[] | select((.why // "") != "")] | length' 2>/dev/null)"
          echo "$st" | jq -r '.stories[] | "- [\(.writer // "?")] [\(.category)] \(.headline)  ::  \((.summary // "")[0:140])"' 2>/dev/null | head -60
          if [ "$hin" != 0 ] || [ "$cut" != 0 ]; then echo "::warning::News quality: $hin stories with Hindi in English fields, $cut cut-off summaries (of $n)"; else echo "::notice::News quality: $n stories, none in the wrong language or cut off"; fi
      - name: The Android app and Google Play (reported here, never blocks a release)
        run: |
          st=$(curl -fsS --max-time 20 https://brodoit.com/api/android/status || echo '{}')
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://brodoit.com/android)
          if [ "$(echo "$st" | jq -r '.ready')" = true ] && [ "$code" = 200 ]; then echo "::notice::Testers download Brodoit $(echo "$st" | jq -r .version) at https://brodoit.com/android · Google Play: $(echo "$st" | jq -c '.play // {}')"
          else echo "::warning::The Android app is not ready for testers yet (/android $code): $(echo "$st" | jq -c '{ready, version, note, play}')"; fi
          # the Play uploader's certificate (public; its key stays on the server): what the Google Cloud service account trusts
          cert=$(curl -fsS --max-time 20 https://brodoit.com/download/play-api-cert.pem || true)
          if echo "$cert" | grep -q 'BEGIN CERTIFICATE'; then echo "Play uploader certificate:"; echo "$cert"; fi
