# Throwaway-branch only: see what Railway is doing with brodoit.com, and redeploy when asked.
# Uses the RAILWAY_TOKEN secret (a Railway project token for production). The repo is public, so Railway's log lines
# are filtered to start / listen / error / crash lines and anything that looks like a key, token, email or phone is
# replaced before it is printed. A commit message containing [redeploy] redeploys the service.
name: Railway ops
on:
  push:
    branches: [claude/deploy-diagnose]
permissions:
  contents: read
jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: brodoit.com right now
        run: |
          for u in /api/health /; do
            code=$(curl -s -o /tmp/b -D /tmp/h -w '%{http_code}' --max-time 30 "https://brodoit.com$u")
            echo "$u -> $code $(grep -i -E '^(x-railway-fallback|server)' /tmp/h | tr -d '\r' | tr '\n' ' ')"
            head -c 200 /tmp/b | tr '\n' ' '; echo
          done
      - name: Railway's status page (current incidents)
        run: |
          txt() { sed -e 's/<script[^>]*>.*<\/script>//g' -e 's/<style[^>]*>.*<\/style>//g' -e 's/<[^>]*>/ /g' -e 's/&amp;/\&/g' -e 's/&#x27;/'"'"'/g' -e 's/&quot;/"/g' | tr -s ' \t' ' ' | grep -v '^ *$'; }
          for u in https://status.railway.com/incident/QH8L8B3E https://status.railway.com/; do
            echo "== $u"; curl -sSL --max-time 30 "$u" | tr '\n' ' ' | sed 's/></>\n</g' | txt | grep -v -i -E 'function|var |window\.|\{|\}' | head -120 || true
          done
          echo "== feed"; for f in https://status.railway.com/feed.rss https://status.railway.com/history.rss https://status.railway.com/api/v2/incidents.json; do echo "-- $f"; curl -sSL --max-time 20 "$f" | head -c 4000; echo; done
      - name: Railway status and the newest deployment's logs (filtered)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then echo "::warning::No RAILWAY_TOKEN secret yet: Railway's logs can't be read from here"; exit 0; fi
          npm i -g @railway/cli@5.63.1 > /dev/null 2>&1
          # keys, tokens, emails and phone numbers never reach this public log
          red() { sed -E -e 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/<email>/g' \
                         -e 's/\+?[0-9][0-9 -]{9,}[0-9]/<number>/g' \
                         -e 's/(sk|xi|gsk|AIza|ghp|gho|pk|rk)[-_A-Za-z0-9]{12,}/<key>/g' \
                         -e 's/[A-Za-z0-9_-]{32,}/<long-id>/g' \
                         -e 's/((key|token|secret|password|authorization)[^=:]{0,20}[=:] *)[^ ,"]+/\1<hidden>/Ig'; }
          echo "== status"; railway status --json 2>&1 | jq -c '{project: .name, services: [.services.edges[]?.node | {name, deployments: [.serviceInstances.edges[]?.node.latestDeployment | {status, createdAt, meta: (.meta.commitHash // "")[0:7]}]}]}' 2>/dev/null || railway status 2>&1 | red | head -20
          echo "== deployments"; railway deployment list --service taskflow 2>&1 | red | head -12 || true
          echo "== build log (last 60 lines)"; timeout 60 railway logs --build --service taskflow 2>&1 | red | tail -60 || true
          echo "== deploy log (start, listen, errors, crashes; last 80)"
          timeout 60 railway logs --deployment --service taskflow 2>&1 | red | grep -i -E "brodoit running|listening|error|fail|crash|killed|out of memory|oom|exit|cannot|undefined|throw|  at |volume|migrat|starting|healthcheck|SIG" | tail -80 || true
          if echo "$MSG" | grep -q '\[redeploy\]'; then echo "== redeploy"; railway redeploy --service taskflow -y 2>&1 | red | tail -5; fi
      - name: The Railway CLI's volume commands (no token needed)
        run: |
          npm i -g @railway/cli@5.63.1 > /dev/null 2>&1
          for c in "volume" "volume add" "volume list"; do echo "== railway $c --help"; railway $c --help 2>&1 | head -40; done
      # [volume] in the commit message: give taskflow a volume at /data if it has none (never deletes or detaches anything)
      - name: Volume at /data
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then echo "::warning::No RAILWAY_TOKEN secret yet"; exit 0; fi
          ids() { sed -E 's/[A-Za-z0-9_-]{32,}/<long-id>/g'; }
          echo "== volumes now"; railway volume --service taskflow list 2>&1 | ids | head -20 || true
          if echo "$MSG" | grep -q '\[volume\]'; then
            if railway volume --service taskflow list 2>&1 | grep -q '/data'; then echo "taskflow already has a volume at /data"
            else echo "== adding a volume at /data"; railway volume --service taskflow add --mount-path /data 2>&1 | ids | tail -5; fi
            echo "== volumes after"; railway volume --service taskflow list 2>&1 | ids | head -20 || true
          fi
      # [attach] in the commit message: attach the existing taskflow-volume (the owner's old data, scheduled for deletion)
      # to taskflow at /data, as the owner asked. Nothing is deleted or detached.
      - name: Reattach the old volume
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then exit 0; fi
          ids() { sed -E 's/[A-Za-z0-9_-]{32,}/<long-id>/g'; }
          for c in "volume attach" "volume update"; do echo "== railway $c --help"; railway $c --help 2>&1 | head -30; done
          if echo "$MSG" | grep -q '\[attach\]'; then
            echo "== attach"
            railway volume --service 736f24b6-270e-49e8-b22a-f830f72d9794 --environment b5552552-8b7b-4e20-881e-6b0f88475b88 attach --volume taskflow-volume --yes 2>&1 | ids | tail -5 || true
            echo "== volumes after"; railway volume --service taskflow list 2>&1 | ids | head -20 || true
            echo "== staged changes after (paths only)"
            curl -sS --max-time 30 https://backboard.railway.com/graphql/v2 -H "Project-Access-Token: $RAILWAY_TOKEN" -H 'Content-Type: application/json' \
              -d '{"query":"query($e:String!){environmentStagedChanges(environmentId:$e){status patch}}","variables":{"e":"b5552552-8b7b-4e20-881e-6b0f88475b88"}}' \
              | jq -r '.data.environmentStagedChanges.patch // {} | paths(scalars) | map(tostring) | join(".")' | ids | head -20
          fi
      - name: Volume and deployment state (read only)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then exit 0; fi
          S=736f24b6-270e-49e8-b22a-f830f72d9794; E=b5552552-8b7b-4e20-881e-6b0f88475b88
          echo "== volume (json)"; railway volume --service $S --environment $E list --json 2>&1 | jq -c '.[]? // . | {name, mountPath, attachedTo: (.serviceName // .attachedTo // .serviceId), state, deletedAt, deletesOn: (.scheduledDeletionAt // .deletesOn), sizeMB: (.currentSizeMB // .usedMB)}' 2>/dev/null || railway volume --service $S --environment $E list 2>&1 | head -12
          echo "== deployments"; railway deployment list --service $S --environment $E 2>&1 | head -8 || true
          echo "== health"; curl -fsS --max-time 20 https://brodoit.com/api/health || true
      - name: Staged changes waiting for a deploy (paths only, never values)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then exit 0; fi
          E=b5552552-8b7b-4e20-881e-6b0f88475b88
          q='{"query":"query($e:String!){environmentStagedChanges(environmentId:$e){id status createdAt patch}}","variables":{"e":"'$E'"}}'
          curl -sS --max-time 30 https://backboard.railway.com/graphql/v2 -H "Project-Access-Token: $RAILWAY_TOKEN" -H 'Content-Type: application/json' -d "$q" > /tmp/staged.json || true
          jq -c '{errors: [.errors[]?.message], status: .data.environmentStagedChanges.status, createdAt: .data.environmentStagedChanges.createdAt}' /tmp/staged.json
          echo "== what is staged (paths only)"
          jq -r '.data.environmentStagedChanges.patch // {} | paths(scalars) | map(tostring) | join(".")' /tmp/staged.json | sed -E 's/[0-9a-f]{8}-[0-9a-f-]{27,}/<id>/g' | head -40
          for c in "environment" "redeploy" "deploy"; do echo "== railway $c --help"; railway $c --help 2>&1 | head -25; done
      - name: Railway API - volume and staged-change operations (read only)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then exit 0; fi
          gq() { curl -sS --max-time 30 https://backboard.railway.com/graphql/v2 -H "Project-Access-Token: $RAILWAY_TOKEN" -H 'Content-Type: application/json' -d "$1"; }
          echo "== mutations about volumes, restores and staged changes"
          gq '{"query":"{__schema{mutationType{fields{name args{name}}}}}"}' | jq -r '.data.__schema.mutationType.fields[] | select(.name|test("olume|estore|ndelete|tage|atchCommit";"i")) | .name + "(" + ([.args[].name]|join(",")) + ")"'
          echo "== VolumeInstance and Volume fields"
          for t in VolumeInstance Volume; do gq '{"query":"{__type(name:\"'$t'\"){fields{name}}}"}' | jq -c --arg t $t '{($t): [.data.__type.fields[]?.name]}'; done
          echo "== the volume, as the API sees it"
          gq '{"query":"{project(id:\"8f37872b-d549-41a9-9828-dc74f4a2e36f\"){volumes{edges{node{id name createdAt volumeInstances{edges{node{id serviceId mountPath state deletedAt environmentId}}}}}}}}"}' | jq -c '.errors // .data' | sed -E 's/[0-9a-f]{8}-[0-9a-f-]{27,}/<id>/g' | head -c 2000; echo
      - name: How the volume appears in the environment config (volumes and mounts only)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then exit 0; fi
          gq() { curl -sS --max-time 30 https://backboard.railway.com/graphql/v2 -H "Project-Access-Token: $RAILWAY_TOKEN" -H 'Content-Type: application/json' -d "$1"; }
          echo "== config query fields on Environment"
          gq '{"query":"{__type(name:\"Environment\"){fields{name}}}"}' | jq -c '[.data.__type.fields[]?.name]'
          echo "== railway environment config (volumes + volumeMounts only)"
          railway environment config --environment b5552552-8b7b-4e20-881e-6b0f88475b88 --json > /tmp/cfg.json 2>/tmp/cfg.err || true
          head -c 300 /tmp/cfg.err; echo
          jq -c '{volumes: (.volumes // .config.volumes), mounts: [((.services // .config.services) // {}) | to_entries[] | {service: .key[0:8], volumeMounts: .value.volumeMounts}]}' /tmp/cfg.json 2>/dev/null | head -c 3000 || echo "(not json)"
          echo; echo "== top-level keys"; jq -c 'keys' /tmp/cfg.json 2>/dev/null || true
