# v31 Book voice: Bro's book notes read by the studio narration (scripts/book-voice/voice/voice.json: English by Chatterbox,
# MIT, in the timbre of Bro's own voice sample; Hindi by Kokoro-82M, Apache-2.0, Bro's Hindi blend), recorded on GitHub's
# free runners a sentence group at a time and published as the release "book-voice-v1" (manifest.json + one mp3 per note).
# The server copies them (modules/bookvoice.js) and plays them before Bro's own recording.
# Only new notes, edited notes and new Hindi notes are read (all of them when the voice changes). Runs every night, after
# a change to the recorder, or by hand; only in the deployed repo (the mirror has no release to fill).
name: Book voice
on:
  schedule:
    - cron: '23 21 * * *'   # 02:53 India time
  push:
    branches: [main]
    paths: ['scripts/book-voice/**', '.github/workflows/book-voice.yml', 'app/bookfull.js', 'app/ideas/**', 'app/briefs/**']
  workflow_dispatch:
    inputs:
      redo:
        description: Record every note again
        type: boolean
        default: false
permissions:
  contents: write
  actions: write   # v33: a run that left notes for later starts the next run itself
concurrency:
  group: book-voice
  cancel-in-progress: false
env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
jobs:
  plan:
    if: github.repository == 'rishabh071106-eng/taskflow'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      count: ${{ steps.p.outputs.count }}
      en: ${{ steps.p.outputs.en }}
      en_shards: ${{ steps.p.outputs.en_shards }}
      en_n: ${{ steps.p.outputs.en_n }}
      hi: ${{ steps.p.outputs.hi }}
      more: ${{ steps.p.outputs.more }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: The notes, and what the release already has
        id: p
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/book-voice/notes.js notes.json https://brodoit.com
          mkdir -p old && (gh release download book-voice-v1 -p manifest.json -D old 2>/dev/null || echo "no release yet")
          node scripts/book-voice/plan.js notes.json old/manifest.json scripts/book-voice/voice todo.json "${{ inputs.redo }}"
      - uses: actions/setup-python@v5
        if: steps.p.outputs.en != '0'
        with: { python-version: '3.11' }
      - name: Bro's voice sample (Kokoro), the timbre the English narration follows
        if: steps.p.outputs.en != '0'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng > /dev/null
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r scripts/book-voice/requirements-kokoro.txt
          python scripts/book-voice/record.py ref scripts/book-voice/voice ref-en.wav
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: |
            notes.json
            todo.json
            ref-en.wav
            old/
          retention-days: 3
          if-no-files-found: error

  record-en:
    needs: plan
    if: needs.plan.outputs.en != '0' && needs.plan.outputs.en != ''
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.en_shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/download-artifact@v4
        with: { name: plan, path: plan }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-book-voice-en-v1
      - name: The English narration voice (Chatterbox, CPU)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r scripts/book-voice/requirements.txt
      - name: Read this runner's notes
        run: python scripts/book-voice/record.py en plan/todo.json ${{ matrix.shard }} ${{ needs.plan.outputs.en_n }} takes scripts/book-voice/voice plan/ref-en.wav
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'takes-en-${{ matrix.shard }}', path: takes, if-no-files-found: ignore, retention-days: 3 }

  record-hi:
    needs: plan
    if: needs.plan.outputs.hi != '0' && needs.plan.outputs.hi != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/download-artifact@v4
        with: { name: plan, path: plan }
      - name: The Hindi narration voice (Kokoro, CPU)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg > /dev/null
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r scripts/book-voice/requirements-kokoro.txt
      - name: Read the Hindi notes
        run: python scripts/book-voice/record.py hi plan/todo.json 0 1 takes scripts/book-voice/voice
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: takes-hi, path: takes, if-no-files-found: ignore, retention-days: 3 }

  publish:
    needs: [plan, record-en, record-hi]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: plan, path: plan }
      - uses: actions/download-artifact@v4
        with: { pattern: 'takes-*', path: takes }
      - name: Up to the release (takes, then the manifest)
        id: pub
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/book-voice/publish.js plan/notes.json plan/old/manifest.json takes scripts/book-voice/voice
      # v33: the 104 books in 7 chapters are more than one run can read; each run that got somewhere starts the next
      # (a run that recorded nothing stops the chain, and the nightly run picks it up again)
      - name: The rest in the next run
        if: needs.plan.outputs.more == 'true' && steps.pub.outputs.uploaded != '0' && steps.pub.outputs.uploaded != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run book-voice.yml --ref main -R "$GITHUB_REPOSITORY" && echo "started the next run"

