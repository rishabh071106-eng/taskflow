# Throwaway-branch only: how far ElevenLabs has recorded the v36 lessons, and how many are safe in the cloud copy.
name: Site probe
on:
  push:
    branches: [claude/deploy-diagnose]
permissions:
  contents: read
jobs:
  lessons:
    runs-on: ubuntu-latest
    steps:
      - name: Lessons recorded, credits, cloud copy
        run: |
          j() { curl -fsS --max-time 20 "https://brodoit.com$1" 2>/dev/null || echo '{}'; }
          echo "site commit: $(j /api/health | jq -r .commit) at $(date -u +%H:%M:%S)"
          echo "book_eleven: $(j /api/learn/voice-status | jq -c '.book_eleven | {state, reason, ready, total, minutes, plan, credits_left, credits_month, credits_reset, error, last}')"
          echo "lessons with cues: $(j /api/book-voice/ready | jq '[.cues // {} | keys[] | select(startswith("lesson-"))] | length')"
          echo "eleven index: $(j /api/book-eleven/index.json | jq -c '{items: (.items | length), lessons: ([.items | keys[] | select(startswith("lesson-"))] | length), voices: ([.items[] | .voice] | unique), mins: ([.items[] | .secs] | add / 60 | floor), shortest: ([.items[] | .secs] | min), longest: ([.items[] | .secs] | max)}')"
          echo "cloud copy: $(curl -fsSL --max-time 60 https://github.com/rishabh071106-eng/taskflow/releases/download/book-eleven-v1/manifest.json | jq -c '{items: (.items | length), lessons: ([.items | keys[] | select(startswith("lesson-"))] | length), with_cues: ([.items[] | select(.cues != null)] | length)}')"
          echo "a late lesson plays: $(curl -s -o /dev/null -w '%{http_code} %{size_download}B' --max-time 60 https://brodoit.com/api/lesson-audio/gtd)"
