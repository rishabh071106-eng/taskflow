# Throwaway-branch only: is brodoit.com up, down or flapping, and does its login screen let a new visitor type?
name: Site probe
on:
  push:
    branches: [claude/deploy-diagnose]
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: /api/health 12 times over 3 minutes
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /tmp/b -D /tmp/h -w '%{http_code}' --max-time 20 https://brodoit.com/api/health)
            echo "$(date -u +%H:%M:%S) $code $(grep -i '^x-railway-fallback' /tmp/h | tr -d '\r') $(head -c 160 /tmp/b | tr '\n' ' ')"
            sleep 15
          done
  login:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: A new visitor types on the login screen (Chromium, phone size)
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y > /dev/null && npm i playwright@1.48.2 > /dev/null 2>&1 && npx playwright install --with-deps chromium > /dev/null 2>&1
          cd "$GITHUB_WORKSPACE" && PW_PATH=/tmp/pw/node_modules/playwright BASE=https://brodoit.com SHOT=login.png node .github/scripts/login-probe.mjs || true
      - name: A returning visitor whose saved login the server no longer knows types on the login screen
        run: cd "$GITHUB_WORKSPACE" && STALE=1 PW_PATH=/tmp/pw/node_modules/playwright BASE=https://brodoit.com SHOT=login-stale.png node .github/scripts/login-probe.mjs || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: login-shot, path: 'login*.png', if-no-files-found: ignore }
  data:
    runs-on: ubuntu-latest
    steps:
      - name: Is the server on its old data volume? (fingerprints from before the deploy)
        run: |
          j() { curl -fsS --max-time 20 "https://brodoit.com$1" 2>/dev/null || echo '{}'; }
          echo "health (users > 0 means the old data is back, after the reattach): $(j /api/health)"
          echo "play uploader cert (was 6C:E0:AF:7C:5F:BB:A7:21...): $(j /api/android/status | jq -c '{version, ready, cert: (.cert_sha256 // "" | .[0:23]), play_api_cert: (.play.apiCertSha256 // "" | .[0:23]), play_state: .play.state}')"
          echo "push key (was not BPfvXAUnm; any change means a new key): $(j /api/push/vapid-key | jq -r '.key // "" | .[0:12]')"
          echo "bro clouds (sealed keys decrypt?): $(j /api/bro/ok | jq -c '{ok, clouds, voice}')"
          echo "news stories: $(j '/api/news/desk?limit=60' | jq '.stories | length') · edition: $(j /api/news/edition | jq -c '{id, count}')"
          echo "voice clips recorded (was 792): $(j /api/learn/voice-status | jq -c '{voice, recorded, total}')"
          echo "assetlinks (package: first 8 bytes of each fingerprint): $(j /.well-known/assetlinks.json | jq -c '[.[].target | {p: .package_name, fp: [.sha256_cert_fingerprints[] | .[0:23]]}]')"
          echo "APK on /android signed with (full): $(j /api/android/status | jq -r '.cert_sha256 // .cert // ""')"
          echo "login fix served (_startPolls in the page): $(curl -fsS --max-time 20 https://brodoit.com/ | grep -c '_startPolls')"
          echo "news fix served (fitCover in news.js?v=26, overflow:hidden in news.css?v=26): $(curl -fsS --max-time 20 'https://brodoit.com/app/news.js?v=26' | grep -c 'function fitCover') / $(curl -fsS --max-time 20 'https://brodoit.com/app/news.css?v=26' | grep -c 'nz-cover .nz-cv{overflow:hidden}')"
          echo "new icon served (icon-*.png?v=6 links on / and /beta; was v=5): $(curl -fsS --max-time 20 https://brodoit.com/ | grep -o 'icon-[a-z0-9-]*\.png?v=[0-9]*' | sort | uniq -c | tr '\n' ' ') / $(curl -fsS --max-time 20 https://brodoit.com/beta | grep -o 'icon-[a-z0-9-]*\.png?v=[0-9]*' | sort -u | tr '\n' ' ')"
          echo "icon files (bytes; new: 41845 176877 125892): $(for f in icon-192.png icon-512.png icon-maskable-512.png; do curl -fsS --max-time 20 -o /dev/null -w '%{size_download} ' "https://brodoit.com/$f?v=6"; done)"
          echo "beta page links (Google Group + Play testing page; old internaltest links: $(curl -fsS --max-time 20 https://brodoit.com/beta | grep -c internaltest)): $(curl -fsS --max-time 20 https://brodoit.com/beta | grep -o 'https://[a-z.]*google.com/[^"<]*' | sort -u | tr '\n' ' ')"
          echo "every link on /beta (public page): $(curl -fsS --max-time 20 https://brodoit.com/beta | grep -oE 'href="[^"]*"' | sort -u | tr '\n' ' ')"
          echo "notifications card for the app served (notify.js?v=2): $(curl -fsS --max-time 20 https://brodoit.com/ | grep -c "notify.js?v=2") / $(curl -fsS --max-time 20 "https://brodoit.com/app/notify.js?v=2" | grep -c "Notifications in the Brodoit app come with an update")"
          echo "chat + speed served (home.css?v=25 / voice.js?v=30 in the page / V.earlyStart in voice.js): $(curl -fsS --max-time 20 https://brodoit.com/ | grep -c 'home.css?v=25') / $(curl -fsS --max-time 20 https://brodoit.com/ | grep -c 'voice.js?v=30') / $(curl -fsS --max-time 20 'https://brodoit.com/app/voice.js?v=30' | grep -c 'V.earlyStart')"
          echo "voice detector sent compressed (content-encoding, bytes): $(curl -sS --max-time 30 -H 'Accept-Encoding: gzip' -D - -o /tmp/w -w ' %{size_download}' https://brodoit.com/app/vendor/vad/ort-wasm-simd-threaded.wasm | grep -iE 'content-encoding|^ [0-9]' | tr -d '\r' | tr '\n' ' ')"
          echo "site commit (main is d7644d3f6773): $(j /api/health | jq -r .commit)"
          for u in 'https://pib.gov.in/RssMain.aspx?ModId=6&Lang=1&Regid=3' 'https://news.un.org/feed/subscribe/en/news/all/rss.xml' 'https://www.who.int/rss-feeds/news-english.xml' 'https://www.rbi.org.in/pressreleases_rss.xml' 'https://www.nasa.gov/news-release/feed/'; do
            code=$(curl -sS -L --max-time 25 -A 'Mozilla/5.0 (Linux; Android 14) BrodoitNews/1.0' -o /tmp/f -w '%{http_code} %{content_type}' "$u" || echo fail)
            echo "official feed $u → $code · items: $(grep -c '<item' /tmp/f 2>/dev/null || echo 0) · first: $(grep -o '<title>[^<]*' /tmp/f 2>/dev/null | sed -n 2p | cut -c8-90)"
          done
          echo "Wikimedia Commons search (Brahmaputra river): $(curl -sS --max-time 25 -A 'BrodoitNews/1.0 (https://brodoit.com; hello@brodoit.com)' 'https://commons.wikimedia.org/w/api.php?action=query&format=json&formatversion=2&generator=search&gsrnamespace=6&gsrlimit=5&gsrsearch=Brahmaputra%20river%20filetype:bitmap&prop=imageinfo&iiprop=url|extmetadata|mime|size&iiurlwidth=960&iiextmetadatafilter=LicenseShortName|Artist&origin=*' | jq -c '[.query.pages[] | {t: .title[0:50], lic: .imageinfo[0].extmetadata.LicenseShortName.value, w: .imageinfo[0].width}]')"
          echo "android build served: $(j /api/android/status | jq -c '{version, build, ready, play_state: .play.state}')"
