# Throwaway-branch only: Play status check-in (Health apps answered? build up?); the beta page.
name: Site probe
on:
  push:
    branches: [claude/deploy-diagnose]
permissions:
  contents: read
jobs:
  play:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the deploy, then Play status and the beta page
        run: |
          j() { curl -fsS --max-time 20 "https://brodoit.com$1" 2>/dev/null || echo '{}'; }
          for i in $(seq 1 40); do
            t=$(curl -fsS --max-time 20 https://brodoit.com/privacy 2>/dev/null | grep -c 'delete-account' || true)
            [ "${t:-0}" -ge 1 ] && break; sleep 30
          done
          echo "deployed after ~$((i*30))s"
          echo "android: $(j /api/android/status | jq -c '{version, ready, play: (.play | del(.account))}')"
          echo "beta lede: $(curl -fsS --max-time 20 https://brodoit.com/beta | grep -oE '<p class="lede">[^<]*' | head -1)"
          echo "beta description: $(curl -fsS --max-time 20 https://brodoit.com/beta | grep -oE '<meta name="description" content="[^"]*"' | head -1)"
          echo "delete-account page: $(curl -s -o /dev/null -w '%{http_code}' https://brodoit.com/delete-account) $(curl -fsS --max-time 20 https://brodoit.com/delete-account | grep -oE '<title>[^<]*' | head -1)"
          echo "review sign-in: $(curl -fsS --max-time 20 -X POST -H 'Content-Type: application/json' -d '{"email":"reviewer@brodoit.com"}' https://brodoit.com/api/send-otp-email)"
          echo "privacy links deletion: $(curl -fsS --max-time 20 https://brodoit.com/privacy | grep -c 'delete-account')"
          echo "beta opt-in link: $(curl -fsS --max-time 20 https://brodoit.com/beta | grep -oE 'play.google.com/apps/testing/[a-z.]+' | head -1)"
          echo "Play testing page (new): $(curl -s -o /dev/null -w '%{http_code}' -L https://play.google.com/apps/testing/com.brodoit.android)"
          echo "Play testing page (old): $(curl -s -o /dev/null -w '%{http_code}' -L https://play.google.com/apps/testing/com.brodoit.twa)"
