# Throwaway-branch only: how many Hindi lessons are recorded, the credits left, and what the cloud copy holds.
name: Site probe
on:
  push:
    branches: [claude/deploy-diagnose]
permissions:
  contents: read
jobs:
  lessons:
    runs-on: ubuntu-latest
    steps:
      - name: Lessons recorded, credits, cloud copy (after the first 20-minute copy has had time)
        run: |
          sleep 300
          j() { curl -fsS --max-time 20 "https://brodoit.com$1" 2>/dev/null || echo '{}'; }
          echo "site commit: $(j /api/health | jq -r .commit) at $(date -u +%H:%M:%S)"
          echo "book_eleven: $(j /api/learn/voice-status | jq -c '.book_eleven | {state, reason, ready, total, minutes, plan, credits_left, credits_month, credits_reset, error, last}')"
          echo "on the site: $(j /api/book-eleven/index.json | jq -c '{items: (.items | length), english: ([.items | keys[] | select(startswith("lesson-") and (startswith("lesson-hi-") | not))] | length), hindi: ([.items | keys[] | select(startswith("lesson-hi-"))] | length), briefs: ([.items | keys[] | select(startswith("brief-"))] | length)}')"
          echo "cloud copy: $(curl -fsSL --max-time 60 https://github.com/rishabh071106-eng/taskflow/releases/download/book-eleven-v1/manifest.json | jq -c '{items: (.items | length), hindi: ([.items | keys[] | select(startswith("lesson-hi-"))] | length), with_cues: ([.items[] | select(.cues != null)] | length), made}')"
