# Throwaway-branch only: where the Google Play release stands (the closed test for Testers Community).
name: Site probe
on:
  push:
    branches: [claude/deploy-diagnose]
permissions:
  contents: read
jobs:
  play:
    runs-on: ubuntu-latest
    steps:
      - name: Play status, the beta page, the testing link
        run: |
          j() { curl -fsS --max-time 20 "https://brodoit.com$1" 2>/dev/null || echo '{}'; }
          echo "android: $(j /api/android/status | jq -c '{version, build, ready, play: (.play | del(.account))}')"
          echo "beta page links: $(curl -fsS --max-time 20 https://brodoit.com/beta | grep -oE 'href="https?://[^"]*"' | sort -u | tr '\n' ' ')"
          echo "beta signups (count only): $(j /api/beta-signup/count | jq -c . 2>/dev/null)"
          echo "Play testing page: $(curl -s -o /dev/null -w '%{http_code}' -L https://play.google.com/apps/testing/com.brodoit.twa)"
          echo "Play store listing: $(curl -s -o /dev/null -w '%{http_code}' 'https://play.google.com/store/apps/details?id=com.brodoit.twa')"
          echo "the group: $(curl -s -o /dev/null -w '%{http_code}' https://groups.google.com/g/brodoit-testing)"
          echo "android release (GitHub): $(curl -fsS https://api.github.com/repos/rishabh071106-eng/taskflow/releases?per_page=5 | jq -c '[.[] | {tag: .tag_name, at: .published_at, assets: [.assets[].name]}] | .[0:3]')"
