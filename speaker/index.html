<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Speaker Agent · Brodoit</title>
<meta name="description" content="Find college talks, guest lectures and part-time teaching roles, track applications and draft pitches with AI.">
<meta name="theme-color" content="#0F1115">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F5F2;--card:#fff;--ink:#1B1A18;--mute:#6B665E;--line:#E8E4DD;--accent:#3DAE5C;--accent-ink:#fff;--warn:#D9822B;--chip:#EFECE6;--shadow:0 6px 20px rgba(0,0,0,.06);
--st-interested:#7B8794;--st-applied:#2F80ED;--st-shortlisted:#9B51E0;--st-confirmed:#27AE60;--st-delivered:#F2994A;--st-declined:#B0A9A0}
@media (prefers-color-scheme:dark){:root{--bg:#0F1115;--card:#181B21;--ink:#F2EFE9;--mute:#9AA0A8;--line:#262A31;--chip:#22262D;--shadow:0 6px 20px rgba(0,0,0,.35)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:16px 16px 96px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 18px}
.back{text-decoration:none;color:var(--mute);font-weight:700;font-size:14px}
h1{font-size:28px;line-height:1.15;margin:4px 0 2px;letter-spacing:-.02em;font-weight:800}
.sub{color:var(--mute);margin:0}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:12px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.ghost{background:transparent}
.btn.danger{color:#C0392B}
.btn:disabled{opacity:.55;cursor:default}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em}
.stat span{color:var(--mute);font-size:13px;font-weight:600}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.tab{border:none;background:var(--chip);color:var(--mute);padding:9px 16px;border-radius:999px;font-weight:700;font-size:14px;white-space:nowrap}
.tab.on{background:var(--ink);color:var(--bg)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.toolbar input,.toolbar select{flex:1;min-width:160px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;width:100%}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:12px;font-weight:700;color:var(--mute);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.board{display:grid;grid-template-columns:repeat(6,minmax(170px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--chip);border-radius:16px;padding:10px;min-height:120px}
.col h3{margin:2px 4px 10px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between;align-items:center}
.col h3 i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow);margin-bottom:8px}
.ev{cursor:pointer}
.ev:hover{border-color:var(--accent)}
.ev .t{font-weight:700;line-height:1.3}
.meta{color:var(--mute);font-size:12.5px;margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 10px}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;color:var(--mute)}
.fit{font-weight:800;font-size:12px;padding:2px 8px;border-radius:999px;color:#fff}
.due{color:var(--warn);font-weight:700}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.disc .t{font-weight:700;line-height:1.35;text-decoration:none}
.disc .t:hover{text-decoration:underline}
.disc p{color:var(--mute);font-size:13px;margin:6px 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.empty{color:var(--mute);text-align:center;padding:30px 10px;font-size:13px}
.res a{display:block;text-decoration:none}
.res .t{font-weight:700}
.res p{color:var(--mute);font-size:13px;margin:4px 0 0}
.res h2{font-size:16px;margin:18px 0 8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px 28px}
@media(min-width:760px){.modal{align-items:center}.sheet{border-radius:20px}}
.sheet h2{margin:0 0 4px;font-size:20px}
.out{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.toast.on{opacity:1}
.signin{max-width:420px;margin:15vh auto;text-align:center}
@media(max-width:640px){.grid2{grid-template-columns:1fr}h1{font-size:24px}.stats{grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:10px}.stat b{font-size:20px}.stat span{font-size:11.5px;line-height:1.25;display:block}.board{grid-template-columns:repeat(6,82vw)}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
var TOKEN=null;try{TOKEN=localStorage.getItem('tf_token')}catch(e){}
var STATUSES=[['interested','Interested'],['applied','Applied'],['shortlisted','Shortlisted'],['confirmed','Confirmed'],['delivered','Delivered'],['declined','Declined']];
var KINDS=[['talk','Talk / keynote'],['guest-lecture','Guest lecture'],['teaching','Part-time teaching'],['workshop','Workshop'],['panel','Panel'],['judge','Hackathon judge'],['mentoring','Mentoring']];
var S={tab:'pipeline',events:[],disc:null,discLoading:false,profile:null,q:'',kind:''};

// Real places to find and apply for college talks and teaching roles
var RESOURCES=[
 ['Part-time & visiting faculty',[
  ['UGC Professor of Practice portal','https://pop.ugc.ac.in/','Register as an industry expert so universities can engage you as a Professor of Practice.'],
  ['LinkedIn: visiting / guest faculty','https://www.linkedin.com/jobs/search/?keywords=visiting%20faculty%20OR%20guest%20faculty&location=India','Live job search for visiting, adjunct and guest faculty roles.'],
  ['Naukri: guest faculty jobs','https://www.naukri.com/guest-faculty-jobs','Indian colleges post part-time and guest faculty openings here.'],
  ['IIM / IIT executive-education programmes','https://www.google.com/search?q=IIM+executive+education+visiting+faculty+industry','Exec-ed and online programmes regularly bring in industry faculty.'],
  ['upGrad / Great Learning / Scaler mentors','https://www.google.com/search?q=upGrad+OR+%22Great+Learning%22+OR+Scaler+industry+mentor+faculty+apply','Ed-tech platforms hire industry experts as instructors and mentors.']]],
 ['Speaking & guest lectures',[
  ['Sessionize: open calls for papers','https://sessionize.com/app/speaker','Many tech conferences and college fests take talk proposals here.'],
  ['KonfHub events','https://konfhub.com/','Indian tech conferences and community meetups.'],
  ['Unstop: college fests & competitions','https://unstop.com/','College fests looking for speakers, judges and mentors.'],
  ['TEDx events in India','https://www.ted.com/tedx/events?when=upcoming&country=India','Contact organisers directly to propose a talk.'],
  ['Meetup: AI / fintech groups','https://www.meetup.com/find/?keywords=AI&source=EVENTS&location=in--Bangalore','Community talks are a good warm-up for college circuits.']]],
 ['Direct outreach (often fastest)',[
  ['Your alma mater (IIM Kozhikode, IIT Bhilai)','https://www.google.com/search?q=IIM+Kozhikode+alumni+guest+lecture','Alumni talks and student clubs are the easiest first yes.'],
  ['Training & Placement cells','https://www.google.com/search?q=engineering+college+training+and+placement+officer+Bengaluru','TPOs organise industry talks; use the AI "Application" draft as a cold email.'],
  ['Student clubs (AI, finance, E-Cell)','https://www.google.com/search?q=E-Cell+OR+%22AI+club%22+college+Bengaluru+speaker','Clubs constantly need speakers for events and webinars.']]]
];

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('on')},2200)}
function api(path,opt){opt=opt||{};opt.headers=Object.assign({'Content-Type':'application/json','x-token':TOKEN||''},opt.headers||{});if(opt.body&&typeof opt.body!=='string')opt.body=JSON.stringify(opt.body);
  return fetch(path,opt).then(function(r){return r.json().then(function(j){if(!r.ok)throw Object.assign(new Error(j.error||('HTTP '+r.status)),{status:r.status,data:j});return j})})}
function fitColor(f){return f>=70?'#27AE60':f>=45?'#D9822B':'#9AA0A8'}
function stColor(s){return 'var(--st-'+s+')'}
function kindLabel(k){for(var i=0;i<KINDS.length;i++)if(KINDS[i][0]===k)return KINDS[i][1];return k}
function daysTo(d){if(!/^\d{4}-\d{2}-\d{2}$/.test(d||''))return null;var t=new Date(d+'T00:00:00');var n=new Date();n.setHours(0,0,0,0);return Math.round((t-n)/864e5)}
function dueLabel(ev){var d=daysTo(ev.deadline);if(d===null||['confirmed','delivered','declined'].indexOf(ev.status)>=0)return'';if(d<0)return'<span class="due">Deadline passed</span>';return'<span class="due">'+(d===0?'Due today':d===1?'Due tomorrow':d+' days left')+'</span>'}

function load(){
  if(!TOKEN){renderSignin();return}
  Promise.all([api('/api/speaker/events'),api('/api/speaker/profile')]).then(function(r){S.events=r[0];S.profile=r[1];render()}).catch(function(e){if(e.status===401){TOKEN=null;renderSignin()}else{document.getElementById('app').innerHTML='<div class="empty">Could not load: '+esc(e.message)+'</div>'}})
}
function renderSignin(){document.getElementById('app').innerHTML='<div class="signin card"><h1>Speaker Agent</h1><p class="sub" style="margin:8px 0 18px">Sign in to Brodoit in this browser first, then come back here.</p><a class="btn primary" href="/">Open Brodoit &rarr;</a></div>'}

function render(){
  var ev=S.events,c={};STATUSES.forEach(function(s){c[s[0]]=0});ev.forEach(function(e){c[e.status]=(c[e.status]||0)+1});
  var upcoming=ev.filter(function(e){return e.status==='confirmed'&&daysTo(e.event_date)!==null&&daysTo(e.event_date)>=0}).length;
  var dueSoon=ev.filter(function(e){var d=daysTo(e.deadline);return d!==null&&d>=0&&d<=7&&['interested','applied'].indexOf(e.status)>=0}).length;
  var h='<header><div><a class="back" href="/">&larr; Brodoit</a><h1>Speaker &amp; Teaching Agent</h1><p class="sub">'+esc(S.profile.name||'You')+' &middot; '+esc(S.profile.headline||'')+'</p></div>'
   +'<div class="row"><button class="btn primary" onclick="runAgent()">&#10024; Run agent</button><button class="btn" onclick="openEvent()">+ Add</button></div></header>';
  h+='<div class="stats">'
   +'<div class="stat"><b>'+ev.length+'</b><span>Tracked</span></div>'
   +'<div class="stat"><b>'+c.applied+'</b><span>Applied</span></div>'
   +'<div class="stat"><b>'+(c.shortlisted+c.confirmed)+'</b><span>Shortlisted / confirmed</span></div>'
   +'<div class="stat"><b>'+upcoming+'</b><span>Upcoming sessions</span></div>'
   +'<div class="stat"><b>'+c.delivered+'</b><span>Delivered</span></div>'
   +'<div class="stat"><b style="color:var(--warn)">'+dueSoon+'</b><span>Deadlines in 7 days</span></div></div>';
  h+='<div class="tabs">'+[['pipeline','Pipeline'],['discover','Discover'],['resources','Where to apply'],['profile','My speaker profile']].map(function(t){return'<button class="tab'+(S.tab===t[0]?' on':'')+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+'</button>'}).join('')+'</div>';
  if(S.tab==='pipeline')h+=renderPipeline();
  else if(S.tab==='discover')h+=renderDiscover();
  else if(S.tab==='resources')h+=renderResources();
  else h+=renderProfile();
  document.getElementById('app').innerHTML=h;
}
function setTab(t){S.tab=t;if(t==='discover'&&!S.disc&&!S.discLoading)discover();render()}

function renderPipeline(){
  var list=S.events.filter(function(e){return(!S.kind||e.kind===S.kind)&&(!S.q||(e.title+' '+e.org+' '+e.location).toLowerCase().indexOf(S.q.toLowerCase())>=0)});
  var h='<div class="toolbar"><input placeholder="Search tracked events" value="'+esc(S.q)+'" oninput="S.q=this.value;clearTimeout(window._qt);window._qt=setTimeout(render,250)"><select onchange="S.kind=this.value;render()"><option value="">All types</option>'+KINDS.map(function(k){return'<option value="'+k[0]+'"'+(S.kind===k[0]?' selected':'')+'>'+k[1]+'</option>'}).join('')+'</select></div>';
  if(!S.events.length)return h+'<div class="card empty">Nothing tracked yet. Hit <b>Run agent</b> to scan live openings for guest lectures, visiting faculty and calls for speakers, or <b>+ Add</b> one you heard about.</div>';
  h+='<div class="board">';
  STATUSES.forEach(function(s){
    var items=list.filter(function(e){return e.status===s[0]});
    h+='<div class="col"><h3><span><i style="background:'+stColor(s[0])+'"></i>'+s[1]+'</span><span class="chip">'+items.length+'</span></h3>';
    items.forEach(function(e){
      h+='<div class="card ev" onclick="openEvent(\''+e.id+'\')"><div class="t">'+esc(e.title)+'</div><div class="meta">'+(e.org?'<span>'+esc(e.org)+'</span>':'')+'<span class="chip">'+esc(kindLabel(e.kind))+'</span>'+(e.fit?'<span class="fit" style="background:'+fitColor(e.fit)+'">'+e.fit+'% fit</span>':'')+'</div>'
        +'<div class="meta">'+(e.event_date?'<span>&#128197; '+esc(e.event_date)+'</span>':'')+(e.location?'<span>&#128205; '+esc(e.location)+'</span>':'')+dueLabel(e)+'</div></div>';
    });
    if(!items.length)h+='<div class="empty" style="padding:14px 4px">—</div>';
    h+='</div>';
  });
  return h+'</div>';
}

function discover(q){
  S.discLoading=true;render();
  api('/api/speaker/discover'+(q?'?q='+encodeURIComponent(q):'')).then(function(r){S.disc=r.items;S.discLoading=false;render()}).catch(function(e){S.discLoading=false;S.disc=[];toast(e.message);render()});
}
function runAgent(){S.tab='discover';S.disc=null;discover();toast('Agent scanning live openings…')}
function renderDiscover(){
  var h='<div class="toolbar"><input id="dq" placeholder="Search a topic or city, e.g. fintech Pune, AI Hyderabad" onkeydown="if(event.key===\'Enter\')discover(this.value)"><button class="btn" onclick="discover(document.getElementById(\'dq\').value)">Search</button><button class="btn ghost" onclick="discover()">Refresh</button></div>';
  h+='<p class="sub" style="font-size:13px;margin:-4px 0 12px">Live results from news and job feeds over the last 60 days, ranked by fit with your profile topics and cities. Open the source to confirm details, then <b>Track</b> it to manage the application.</p>';
  if(S.discLoading)return h+'<div class="card empty">Scanning feeds for guest lectures, visiting faculty roles and calls for speakers…</div>';
  if(!S.disc||!S.disc.length)return h+'<div class="card empty">No live results right now. Try a different search, or use <a href="#" onclick="setTab(\'resources\');return false">Where to apply</a>.</div>';
  h+='<div class="list">';
  S.disc.forEach(function(d,i){
    h+='<div class="card disc"><div class="row" style="justify-content:space-between;margin-bottom:6px"><span class="chip">'+esc(kindLabel(d.kind))+'</span><span class="fit" style="background:'+fitColor(d.fit)+'">'+d.fit+'% fit</span></div>'
     +'<a class="t" href="'+esc(d.url)+'" target="_blank" rel="noopener">'+esc(d.title)+'</a>'
     +'<div class="meta"><span>'+esc(d.org)+'</span><span>'+esc((d.date||'').slice(0,16))+'</span></div>'
     +'<div class="row" style="margin-top:10px">'+(d.tracked?'<span class="chip">&#10003; Tracked</span>':'<button class="btn sm primary" onclick="trackDisc('+i+')">Track</button>')+'<a class="btn sm" href="'+esc(d.url)+'" target="_blank" rel="noopener">Open source</a></div></div>';
  });
  return h+'</div>';
}
function trackDisc(i){
  var d=S.disc[i];
  api('/api/speaker/events',{method:'POST',body:{title:d.title,org:d.org,kind:d.kind,url:d.url,source:'agent',fit:d.fit,notes:'Found by agent '+new Date().toISOString().slice(0,10)+'. Confirm dates, eligibility and contact on the source page.'}})
   .then(function(e){S.events.unshift(e);d.tracked=true;toast('Added to pipeline');render()})
   .catch(function(e){if(e.status===409){d.tracked=true;render()}toast(e.message)});
}

function renderResources(){
  var h='<div class="res">';
  RESOURCES.forEach(function(g){
    h+='<h2>'+esc(g[0])+'</h2><div class="list">';
    g[1].forEach(function(r){h+='<div class="card"><a href="'+esc(r[1])+'" target="_blank" rel="noopener"><div class="t">'+esc(r[0])+' &#8599;</div><p>'+esc(r[2])+'</p></a></div>'});
    h+='</div>';
  });
  h+='<h2>General outreach</h2><div class="card"><p class="sub" style="margin:0 0 10px">No specific opening? Let the agent draft a cold email to a college or a course outline you can pitch.</p><div class="row"><button class="btn" onclick="genericDraft(\'application\')">Draft cold email to a college</button><button class="btn" onclick="genericDraft(\'syllabus\')">Draft a part-time course outline</button><button class="btn" onclick="genericDraft(\'abstract\')">Draft a signature talk</button></div></div>';
  return h+'</div>';
}

function renderProfile(){
  var p=S.profile;
  return'<div class="card"><p class="sub" style="margin:0 0 6px">The agent uses this to rank openings and write your applications. Paste your resume text so drafts stay accurate.</p>'
   +'<div class="grid2"><div><label>Name</label><input id="p_name" value="'+esc(p.name)+'"></div><div><label>Headline</label><input id="p_headline" value="'+esc(p.headline)+'"></div></div>'
   +'<label>Short bio</label><textarea id="p_bio" placeholder="2-3 sentences about your experience">'+esc(p.bio)+'</textarea>'
   +'<div class="grid2"><div><label>Talk topics (comma separated)</label><textarea id="p_topics">'+esc((p.topics||[]).join(', '))+'</textarea></div><div><label>Subjects you can teach</label><textarea id="p_subjects">'+esc((p.subjects||[]).join(', '))+'</textarea></div></div>'
   +'<div class="grid2"><div><label>Preferred cities</label><input id="p_cities" value="'+esc((p.cities||[]).join(', '))+'"></div><div><label>Teaching hours per week</label><input id="p_hours" type="number" min="0" max="40" value="'+esc(p.hoursPerWeek)+'"></div></div>'
   +'<label style="display:flex;gap:8px;align-items:center;text-transform:none;font-size:14px;color:var(--ink)"><input id="p_online" type="checkbox" style="width:auto"'+(p.online?' checked':'')+'> Open to online / virtual sessions</label>'
   +'<label>Resume (plain text)</label><textarea id="p_resume" style="min-height:200px" placeholder="Paste your resume here">'+esc(p.resume)+'</textarea>'
   +'<div class="row" style="margin-top:14px"><button class="btn primary" onclick="saveProfile()">Save profile</button></div></div>';
}
function saveProfile(){
  var g=function(id){return document.getElementById(id)};
  api('/api/speaker/profile',{method:'PUT',body:{name:g('p_name').value,headline:g('p_headline').value,bio:g('p_bio').value,topics:g('p_topics').value,subjects:g('p_subjects').value,cities:g('p_cities').value,hoursPerWeek:g('p_hours').value,online:g('p_online').checked,resume:g('p_resume').value}})
   .then(function(p){S.profile=p;S.disc=null;toast('Profile saved');render()}).catch(function(e){toast(e.message)});
}

// ── Event sheet ──
var CUR=null;
function openEvent(id){
  CUR=id?S.events.filter(function(e){return e.id===id})[0]:{title:'',org:'',kind:'guest-lecture',mode:'in-person',location:'',event_date:'',deadline:'',url:'',contact:'',status:'interested',notes:'',draft:''};
  var e=CUR,isNew=!e.id;
  var opt=function(list,v){return list.map(function(x){return'<option value="'+x[0]+'"'+(x[0]===v?' selected':'')+'>'+x[1]+'</option>'}).join('')};
  var h='<div class="row" style="justify-content:space-between"><h2>'+(isNew?'Add opportunity':'Opportunity')+'</h2><button class="btn ghost sm" onclick="closeModal()">&#10005;</button></div>'
   +'<label>Title</label><input id="e_title" value="'+esc(e.title)+'" placeholder="e.g. Guest lecture on GenAI in banking">'
   +'<div class="grid2"><div><label>College / organisation</label><input id="e_org" value="'+esc(e.org)+'"></div><div><label>Location</label><input id="e_location" value="'+esc(e.location)+'"></div>'
   +'<div><label>Type</label><select id="e_kind">'+opt(KINDS,e.kind)+'</select></div><div><label>Mode</label><select id="e_mode">'+opt([['in-person','In person'],['online','Online'],['hybrid','Hybrid']],e.mode)+'</select></div>'
   +'<div><label>Event date</label><input id="e_event_date" type="date" value="'+esc(e.event_date)+'"></div><div><label>Application deadline</label><input id="e_deadline" type="date" value="'+esc(e.deadline)+'"></div>'
   +'<div><label>Link</label><input id="e_url" value="'+esc(e.url)+'" placeholder="https://"></div><div><label>Contact (email / name)</label><input id="e_contact" value="'+esc(e.contact)+'"></div></div>'
   +'<label>Status</label><select id="e_status">'+opt(STATUSES,e.status)+'</select>'
   +'<label>Notes</label><textarea id="e_notes">'+esc(e.notes)+'</textarea>'
   +'<div class="row" style="margin-top:14px"><button class="btn primary" onclick="saveEvent()">'+(isNew?'Add to pipeline':'Save')+'</button>'
   +(isNew?'':'<button class="btn" onclick="toTask()">Add deadline to my tasks</button>'+(e.url?'<a class="btn" href="'+esc(e.url)+'" target="_blank" rel="noopener">Open link &#8599;</a>':'')+'<button class="btn ghost danger" onclick="delEvent()">Delete</button>')+'</div>';
  if(!isNew){
    h+='<h2 style="margin-top:22px">&#10024; Agent</h2><p class="sub" style="font-size:13px">Drafts use your speaker profile and this opportunity. Review before sending.</p>'
     +'<div class="row" style="margin-top:8px"><button class="btn sm" onclick="draft(\'application\')">Application email</button><button class="btn sm" onclick="draft(\'abstract\')">Talk proposal</button><button class="btn sm" onclick="draft(\'syllabus\')">Course outline</button><button class="btn sm" onclick="draft(\'followup\')">Follow-up</button></div>'
     +'<div id="draftOut">'+(e.draft?draftBlock(e.draft):'')+'</div>';
  }
  document.getElementById('sheet').innerHTML=h;document.getElementById('modal').classList.add('on');
}
function draftBlock(t){
  var mail=(CUR&&CUR.contact&&/@/.test(CUR.contact))?CUR.contact.match(/[^\s<>,;]+@[^\s<>,;]+/)[0]:'';
  var subj=(t.match(/^Subject:\s*(.+)$/im)||[])[1]||'';var body=t.replace(/^Subject:.*\n?/im,'').trim();
  return'<div class="out" id="draftText">'+esc(t)+'</div><div class="row" style="margin-top:8px"><button class="btn sm" onclick="copyDraft()">Copy</button>'+(mail||subj?'<a class="btn sm" href="mailto:'+encodeURIComponent(mail)+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body)+'">Open in email</a>':'')+'<button class="btn sm" onclick="markApplied()">Mark as applied</button></div>';
}
function copyDraft(){var t=document.getElementById('draftText').textContent;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){toast('Copied')}).catch(function(){toast('Select and copy the text')})}
function closeModal(){document.getElementById('modal').classList.remove('on');CUR=null}
function formVals(){var o={};['title','org','kind','mode','location','event_date','deadline','url','contact','status','notes'].forEach(function(k){o[k]=document.getElementById('e_'+k).value});return o}
function saveEvent(){
  var b=formVals();if(!b.title.trim()){toast('Add a title');return}
  var p=CUR.id?api('/api/speaker/events/'+CUR.id,{method:'PUT',body:b}):api('/api/speaker/events',{method:'POST',body:b});
  p.then(function(e){var i=S.events.findIndex(function(x){return x.id===e.id});if(i>=0)S.events[i]=e;else S.events.unshift(e);toast('Saved');closeModal();S.tab='pipeline';render()}).catch(function(e){toast(e.message)});
}
function markApplied(){document.getElementById('e_status').value='applied';saveEvent()}
function delEvent(){if(!confirm('Delete this opportunity?'))return;api('/api/speaker/events/'+CUR.id,{method:'DELETE'}).then(function(){S.events=S.events.filter(function(x){return x.id!==CUR.id});closeModal();render()})}
function toTask(){api('/api/speaker/events/'+CUR.id+'/task',{method:'POST'}).then(function(){toast('Added to your Brodoit tasks')}).catch(function(e){toast(e.message)})}
function draft(type){
  var out=document.getElementById('draftOut');out.innerHTML='<div class="out">Drafting…</div>';
  api('/api/speaker/draft',{method:'POST',body:{id:CUR.id,type:type}}).then(function(r){out.innerHTML=draftBlock(r.draft);if(type==='application'||type==='followup'){CUR.draft=r.draft}}).catch(function(e){out.innerHTML='<div class="out">'+esc(e.message)+'</div>'});
}
function genericDraft(type){
  CUR={};document.getElementById('sheet').innerHTML='<div class="row" style="justify-content:space-between"><h2>Agent draft</h2><button class="btn ghost sm" onclick="closeModal()">&#10005;</button></div><div id="draftOut"><div class="out">Drafting…</div></div>';
  document.getElementById('modal').classList.add('on');
  api('/api/speaker/draft',{method:'POST',body:{type:type,context:'Proactive outreach to engineering and management colleges in '+((S.profile.cities||[]).join(', ')||'India')+' offering guest lectures, workshops or a part-time elective.'}})
   .then(function(r){document.getElementById('draftOut').innerHTML='<div class="out" id="draftText">'+esc(r.draft)+'</div><div class="row" style="margin-top:8px"><button class="btn sm" onclick="copyDraft()">Copy</button></div>'}).catch(function(e){document.getElementById('draftOut').innerHTML='<div class="out">'+esc(e.message)+'</div>'});
}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});
load();
</script>
</body>
</html>
